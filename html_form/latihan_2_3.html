<!DOCTYPE html>

    <body>
        
        <div id="header">
            <h2> Form Pendaftaran Mahasiswa Baru</h2>
            <form action="proses.php" method="POST"> 
        </div>

        <div id="main"><!-- Isi disini id="main"-->
            <div id="link"> 
                
            </div>
            
            <div id="content">
                    <label>Nama Lengkap:</label>
                    <input type="text" name="nama_lengkap" required><br><br>
                    <label>Tempat Tanggal Lahir:</label>
                    <input type="text" name="tempat_lahir" required>
                <select name="tanggal">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
                <select name="bulan">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
                <select name="tahun">
                    <option value="1989">1989</option>
                    <option value="1990">1990</option>
                    <option value="1991">1991</option>
                    <option value="1992">1992</option>
                    <option value="1993">1993</option>
                    <option value="1994">1994</option>
                </select><br><br>
                <label>Agama:</label>
                <select name="agama">
                    <option value="Islam">Islam</option>
                    <option value="Kristen">Kristen</option>
                    <option value="Katolik">Katolik</option>
                    <option value="Hindu">Hindu</option>
                    <option value="Budha">Budha</option>
                    <option value="Konghucu">Konghucu</option>
                </select><br><br>
                    <label>Jenis Kelamin:</label>
                    <input type="radio" name="jenis_kelamin" value="Laki-laki"> Laki-laki
                    <input type="radio" name="jenis_kelamin" value="Perempuan"> Perempuan<br><br>
                    <label>No. Ijazah SMA/MA:</label>
                    <input type="text" name="no_ijazah" required><br><br>
                    <label>Foto (Ukuran File Maks. 20 KB):</label>
                    <input type="file" name="foto" accept="image/*"><br><br>
                    <label>Nama Ayah:</label>
                    <input type="text" name="nama_ayah"><br><br>
                    <label>Nama Ibu:</label>
                    <input type="text" name="nama_ibu"><br><br>
                    <label>Alamat Rumah:</label><br>
                    <textarea name="alamat_rumah" rows="3" cols="40"></textarea><br><br>
                    <label>No. Telp:</label>
                    <input type="text" name="no_telp"><br><br>
                    <label>Nama Sekolah Asal:</label>
                    <input type="text" name="nama_sekolah"><br><br>
                    <label>Alamat Sekolah Asal:</label><br>
                    <textarea name="alamat_sekolah" rows="3" cols="40"></textarea><br><br>
                    <label>Jurusan Dipilih:</label>
                <select name="jurusan">
                    <option value="">-PILIH-</option>
                    <option value="Komputerisasi Akuntansi">Komputerisasi Akuntansi</option>
                    <option value="Administrasi Bisnis">Administrasi Bisnis</option>
                    <option value="Teknik Komputer Kontrol">Teknik komputer kontrol</option>
                    <option value="Teknik Listrik">Teknik Listrik</option>
                    <option value="Mesin Otomotif">Mesin Otomotif</option>
                    <option value="Perkeretaapian">Perkeretaapian</option>
                    <option value="Teknologi informasi">Teknologi Informasi</option>
                    <option value="Akuntansi">Akuntansi</option>

                </select><br><br>
                    <label>Tahu informasi ini dari:</label><br>
                    <input type="checkbox" name="info[]" value="Koran"> Koran
                    <input type="checkbox" name="info[]" value="Website"> Website
                    <input type="checkbox" name="info[]" value="Televisi"> Televisi
                    <input type="checkbox" name="info[]" value="Radio"> Radio
                    <input type="checkbox" name="info[]" value="Teman"> Teman<br><br>

                    <button type="submit">DAFTAR</button>
                    <button type="reset">BATAL</button>
            </div>
